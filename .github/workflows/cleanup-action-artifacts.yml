name: Actions Artifact 定期清理｜保留 2 天

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-action-artifacts.yml
  schedule:
    # 每 6 小时检查一次，删除超过 48 小时的所有 Actions Artifact。
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cleanup-action-artifacts
  cancel-in-progress: true

jobs:
  cleanup:
    name: 删除超过 2 天的 Actions Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 清理 Public_Gbt 过期 Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const token = process.env.GH_TOKEN || '';
          const repository = process.env.REPOSITORY || '';
          const [owner, repo] = repository.split('/');

          const retentionHours = 48;
          const cutoffMs = Date.now() - retentionHours * 60 * 60 * 1000;

          if (!token || !owner || !repo) {
            throw new Error('缺少 GITHUB_TOKEN 或仓库资料。');
          }

          function formatBytes(bytes) {
            const value = Number(bytes || 0);
            if (!value) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            const index = Math.min(
              Math.floor(Math.log(value) / Math.log(1024)),
              units.length - 1
            );
            return `${(value / (1024 ** index)).toFixed(index === 0 ? 0 : 2)} ${units[index]}`;
          }

          async function request(url, options = {}, retries = 2) {
            let lastError;

            for (let attempt = 0; attempt <= retries; attempt += 1) {
              try {
                const response = await fetch(url, {
                  ...options,
                  headers: {
                    Accept: 'application/vnd.github+json',
                    Authorization: `Bearer ${token}`,
                    'X-GitHub-Api-Version': '2022-11-28',
                    'User-Agent': 'Public-Gbt-Artifact-Cleanup',
                    ...(options.headers || {}),
                  },
                });

                if (response.status >= 500 && attempt < retries) {
                  await new Promise((resolve) => setTimeout(resolve, 1000 * (attempt + 1)));
                  continue;
                }

                return response;
              } catch (error) {
                lastError = error;
                if (attempt < retries) {
                  await new Promise((resolve) => setTimeout(resolve, 1000 * (attempt + 1)));
                  continue;
                }
              }
            }

            throw lastError || new Error(`请求失败：${url}`);
          }

          async function listArtifacts() {
            const artifacts = [];
            let page = 1;

            while (true) {
              const url = `https://api.github.com/repos/${owner}/${repo}/actions/artifacts?per_page=100&page=${page}`;
              const response = await request(url);

              if (!response.ok) {
                let message = `${response.status} ${response.statusText}`;
                try {
                  const body = await response.json();
                  if (body?.message) message = `${response.status} ${body.message}`;
                } catch {}
                throw new Error(`无法读取 Artifact：${message}`);
              }

              const body = await response.json();
              const pageArtifacts = Array.isArray(body.artifacts) ? body.artifacts : [];
              artifacts.push(...pageArtifacts);

              if (pageArtifacts.length < 100) break;
              page += 1;
            }

            return artifacts;
          }

          async function deleteArtifact(id) {
            const url = `https://api.github.com/repos/${owner}/${repo}/actions/artifacts/${id}`;
            const response = await request(url, { method: 'DELETE' });

            if (response.status === 204) return;

            let message = `${response.status} ${response.statusText}`;
            try {
              const body = await response.json();
              if (body?.message) message = `${response.status} ${body.message}`;
            } catch {}

            throw new Error(message);
          }

          async function main() {
            const artifacts = await listArtifacts();
            const deleted = [];
            const kept = [];
            const failed = [];

            for (const artifact of artifacts) {
              const createdAtMs = Date.parse(artifact.created_at);
              const sizeBytes = Number(artifact.size_in_bytes || 0);

              if (!Number.isFinite(createdAtMs)) {
                failed.push({
                  name: artifact.name,
                  reason: `无法解析建立时间：${artifact.created_at}`,
                });
                continue;
              }

              const ageHours = (Date.now() - createdAtMs) / (60 * 60 * 1000);

              if (createdAtMs >= cutoffMs) {
                kept.push({ name: artifact.name, ageHours, sizeBytes });
                continue;
              }

              try {
                await deleteArtifact(artifact.id);
                deleted.push({ name: artifact.name, ageHours, sizeBytes });
              } catch (error) {
                failed.push({
                  name: artifact.name,
                  reason: error?.message || String(error),
                });
              }
            }

            const deletedBytes = deleted.reduce((sum, item) => sum + item.sizeBytes, 0);
            const keptBytes = kept.reduce((sum, item) => sum + item.sizeBytes, 0);

            console.log(`扫描 Artifact：${artifacts.length}`);
            console.log(`已删除：${deleted.length}`);
            console.log(`48 小时内保留：${kept.length}`);
            console.log(`处理失败：${failed.length}`);
            console.log(`预计释放空间：${formatBytes(deletedBytes)}`);
            console.log(`48 小时内现存空间：${formatBytes(keptBytes)}`);

            for (const item of deleted) {
              console.log(
                `已删除｜${item.name}｜${item.ageHours.toFixed(1)} 小时｜${formatBytes(item.sizeBytes)}`
              );
            }

            for (const item of failed) {
              console.warn(`删除失败｜${item.name}｜${item.reason}`);
            }

            const summary = [];
            summary.push('# Public_Gbt Actions Artifact 定期清理结果');
            summary.push('');
            summary.push(`保留时间：${retentionHours} 小时`);
            summary.push('');
            summary.push('| 项目 | 数量 / 容量 |');
            summary.push('|---|---:|');
            summary.push(`| 已扫描 Artifact | ${artifacts.length} |`);
            summary.push(`| 已删除（超过 48 小时） | ${deleted.length} |`);
            summary.push(`| 继续保留（48 小时内） | ${kept.length} |`);
            summary.push(`| 预计释放空间 | ${formatBytes(deletedBytes)} |`);
            summary.push(`| 48 小时内现存空间 | ${formatBytes(keptBytes)} |`);
            summary.push(`| 处理失败 | ${failed.length} |`);

            if (deleted.length) {
              summary.push('');
              summary.push('## 本次已删除');
              summary.push('');
              summary.push('| Artifact | 年龄 | 容量 |');
              summary.push('|---|---:|---:|');
              for (const item of deleted) {
                const safeName = String(item.name || '').replaceAll('|', '\\|');
                summary.push(
                  `| ${safeName} | ${item.ageHours.toFixed(1)} 小时 | ${formatBytes(item.sizeBytes)} |`
                );
              }
            }

            if (failed.length) {
              summary.push('');
              summary.push('## 处理失败');
              summary.push('');
              summary.push('| Artifact | 原因 |');
              summary.push('|---|---|');
              for (const item of failed) {
                const safeName = String(item.name || '').replaceAll('|', '\\|');
                const safeReason = String(item.reason || '').replaceAll('|', '\\|');
                summary.push(`| ${safeName} | ${safeReason} |`);
              }
            }

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);

            if (failed.length > 0) {
              throw new Error(`有 ${failed.length} 个 Artifact 删除失败。`);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
