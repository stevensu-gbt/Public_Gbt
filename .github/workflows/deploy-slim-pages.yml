name: Deploy slim GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "recordings/oncc/player.html"
      - "screenshots/hkjc/HK_Mark_Six_TIME_2110.json"
      - ".github/workflows/deploy-slim-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare slim site
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site/recordings/oncc
          mkdir -p _site/screenshots/hkjc

          cp recordings/oncc/player.html _site/recordings/oncc/player.html
          cp screenshots/hkjc/HK_Mark_Six_TIME_2110.json _site/screenshots/hkjc/HK_Mark_Six_TIME_2110.json

          touch _site/.nojekyll

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-Hant">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Public_Gbt</title>
          </head>
          <body>
            <p><a href="recordings/oncc/player.html">ONCC 錄像回放</a></p>
          </body>
          </html>
          HTML

          echo "Published files:"
          find _site -type f -printf '%p %s bytes\n' | sort
          echo "Total size:"
          du -sh _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
